<!-- v1.0 -->
<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعیین سطح انگلیسی — English Level Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--bg2:#161822;--card:#1e2030;--card-hover:#262940;--border:#353a54;--text:#f0f2f5;--text2:#b0b8cc;--accent:#7c6cf0;--accent2:#b4a8ff;--accent-glow:rgba(124,108,240,.2);--success:#2dd4a0;--danger:#f0825e;--warning:#fdd663;--radius:16px;--shadow:0 4px 24px rgba(0,0,0,.5);--shadow-sm:0 2px 8px rgba(0,0,0,.3);--font:'Vazirmatn',system-ui,sans-serif}
[data-theme="light"]{--bg:#f0f2f5;--bg2:#ffffff;--card:#ffffff;--card-hover:#f5f6fa;--border:#d0d5e0;--text:#1a1d27;--text2:#4a5068;--accent:#6c5ce7;--accent2:#a29bfe;--success:#00a884;--danger:#e17055;--warning:#e6a817;--shadow:0 4px 24px rgba(0,0,0,.08);--shadow-sm:0 2px 8px rgba(0,0,0,.05);--accent-glow:rgba(108,92,231,.12)}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;padding-bottom:104px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.topbar h2{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.back-btn{background:none;border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.back-btn:hover{background:var(--accent-glow);border-color:var(--accent)}
.main{padding:16px}
.btn{padding:10px 22px;border:none;border-radius:12px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;box-shadow:0 2px 12px rgba(108,92,231,.3)}.btn-primary:hover{box-shadow:0 4px 20px rgba(108,92,231,.45);transform:translateY(-1px)}
.btn-success{background:linear-gradient(135deg,var(--success),#00d2a0);color:#fff;box-shadow:0 2px 12px rgba(0,184,148,.3)}
.btn-danger{background:linear-gradient(135deg,var(--danger),#f0825e);color:#fff}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--accent-glow);color:var(--text);border-color:var(--accent)}
.btn-sm{padding:7px 16px;font-size:.8rem;border-radius:10px}
.card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);transition:all .3s}
.input{width:100%;padding:11px 16px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:.85rem;transition:all .25s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.progress-bar{width:100%;height:8px;background:var(--border);border-radius:6px;overflow:hidden;margin:10px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .5s}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.stat-card{text-align:center;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);transition:all .3s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.stat-card .val{font-size:1.9rem;font-weight:800;color:var(--accent);line-height:1.2}
.stat-card .lbl{font-size:.75rem;color:var(--text2);margin-top:6px}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.7rem;font-weight:600}
.badge-success{background:rgba(0,184,148,.15);color:var(--success);border:1px solid rgba(0,184,148,.2)}
.badge-danger{background:rgba(225,112,85,.15);color:var(--danger);border:1px solid rgba(225,112,85,.2)}
.badge-warning{background:rgba(253,203,110,.15);color:var(--warning);border:1px solid rgba(253,203,110,.2)}
.badge-accent{background:rgba(124,108,240,.18);color:var(--accent2);border:1px solid rgba(124,108,240,.25);font-weight:700}
.hidden{display:none!important}
.empty{text-align:center;padding:48px 20px;color:var(--text2)}
.empty .icon{font-size:3rem;margin-bottom:12px;opacity:.5}
.toast-container{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{padding:14px 28px;border-radius:14px;color:#fff;font-size:.88rem;font-weight:500;pointer-events:auto;animation:slideIn .4s cubic-bezier(.4,0,.2,1);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.toast-success{background:linear-gradient(135deg,var(--success),#00d2a0)}.toast-error{background:linear-gradient(135deg,var(--danger),#f0825e)}.toast-info{background:linear-gradient(135deg,var(--accent),#7c6cf0)}
@keyframes slideIn{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.theme-toggle{background:none;border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.15rem;display:flex;align-items:center;justify-content:center;transition:all .3s}
.theme-toggle:hover{background:var(--accent-glow);border-color:var(--accent);transform:rotate(30deg)}
.hamburger{background:none;border:none;color:var(--text);font-size:1.5rem;cursor:pointer;padding:8px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.hamburger:hover{background:var(--accent-glow)}
@media(max-width:768px){.main{padding:12px}.stat-grid{grid-template-columns:repeat(2,1fr)}.topbar{padding:10px 12px}.topbar h2{font-size:1rem}}
/* ═══ QUIZ STYLES ═══ */
.quiz-hero{text-align:center;padding:24px 20px;background:linear-gradient(135deg,var(--accent),#764ba2);color:#fff;border-radius:16px;margin-bottom:20px;box-shadow:0 8px 32px rgba(108,92,231,.35)}
.quiz-hero h2{font-size:2rem;font-weight:800;margin-bottom:10px}
.quiz-hero p{opacity:.9;font-size:1rem}
.quiz-section-btn{width:100%;text-align:right;padding:18px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:16px;color:var(--text)}
.quiz-section-btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.quiz-section-btn .sec-icon{font-size:2rem;width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quiz-section-btn .sec-info{flex:1}
.quiz-section-btn .sec-title{font-size:1rem;font-weight:700;margin-bottom:4px}
.quiz-section-btn .sec-desc{font-size:.8rem;color:var(--text2)}
.quiz-section-btn .sec-status{font-size:.8rem}
.question-card{max-width:600px;margin:0 auto 20px}
.q-number{font-size:.8rem;color:var(--text2);margin-bottom:8px}
.q-text{font-size:1.1rem;font-weight:600;margin-bottom:16px;line-height:1.8}
.q-text-en{font-size:1.05rem;color:var(--accent);direction:ltr;text-align:left;margin-bottom:12px;font-weight:600}
.q-options{display:grid;gap:8px}
.q-option{width:100%;text-align:left;direction:ltr;padding:14px 16px;border:2px solid var(--border);border-radius:12px;background:var(--bg2);color:var(--text);font:inherit;font-size:.95rem;cursor:pointer;transition:all .25s;text-align:left;font-weight:500}
.q-option:hover{border-color:var(--accent);background:var(--accent-glow)}
.q-option.selected{border-color:var(--accent);background:rgba(108,92,231,.15);font-weight:600}
.q-option.correct{border-color:var(--success);background:rgba(0,184,148,.15);color:var(--success)}
.q-option.wrong{border-color:var(--danger);background:rgba(225,112,85,.15);color:var(--danger)}
.q-option:disabled{cursor:default;opacity:.8}
.q-input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:12px;background:var(--bg2);color:var(--text);font:inherit;font-size:1rem;direction:ltr;text-align:left;transition:all .25s;font-weight:500}
.q-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.q-explanation{margin-top:12px;padding:12px 16px;background:rgba(45,212,160,.08);border:1px solid rgba(45,212,160,.2);border-radius:10px;font-size:.85rem;color:var(--text);line-height:1.6;font-weight:500}
.q-nav{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
/* ═══ LISTENING ═══ */
.listen-btn{width:80px;height:80px;border-radius:50%;border:3px solid var(--accent);background:var(--card);color:var(--accent);font-size:2rem;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.listen-btn:hover{background:var(--accent);color:#fff;transform:scale(1.1);box-shadow:0 4px 20px rgba(108,92,231,.4)}
.listen-btn.playing{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
/* ═══ RESULTS ═══ */
.result-hero{text-align:center;padding:48px 24px;border-radius:20px;margin-bottom:28px;position:relative;overflow:hidden}
.result-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent),#764ba2);z-index:0}
.result-hero>*{position:relative;z-index:1;color:#fff}
.level-badge{display:inline-block;padding:12px 32px;border-radius:16px;font-size:2.5rem;font-weight:900;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);margin-bottom:16px}
.level-label{font-size:1.2rem;font-weight:600;opacity:.9}
.level-desc{font-size:.9rem;opacity:.75;margin-top:6px}
.score-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.score-bar .label{width:100px;font-size:.85rem;color:var(--text2);text-align:left;flex-shrink:0;font-weight:600}
.score-bar .bar{flex:1;height:12px;background:var(--border);border-radius:6px;overflow:hidden}
.score-bar .fill{height:100%;border-radius:6px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.score-bar .pct{width:45px;font-size:.85rem;font-weight:700;text-align:center}
.level-scale{display:flex;gap:4px;margin:20px 0}
.level-scale .ls-item{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:.7rem;font-weight:600;background:var(--bg);color:var(--text2);border:2px solid transparent;transition:all .3s}
.level-scale .ls-item.current{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
/* ═══ WRITING ═══ */
.writing-area{width:100%;min-height:120px;padding:16px;border:2px solid var(--border);border-radius:12px;background:var(--bg2);color:var(--text);font:inherit;font-size:.95rem;direction:ltr;text-align:left;resize:vertical;line-height:1.8;transition:all .25s;font-weight:500}
.writing-area:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.writing-feedback{margin-top:12px;padding:14px;border-radius:12px;font-size:.85rem;line-height:1.6}
.writing-feedback.good{background:rgba(0,184,148,.08);border:1px solid rgba(0,184,148,.2)}
.writing-feedback.moderate{background:rgba(253,203,110,.08);border:1px solid rgba(253,203,110,.2)}
.writing-feedback.weak{background:rgba(225,112,85,.08);border:1px solid rgba(225,112,85,.2)}
/* ═══ REVIEW OPTIONS ═══ */
.review-opt{padding:8px 12px;border-radius:8px;border:1px solid var(--border);font-size:.85rem;direction:ltr;text-align:left;margin-bottom:6px}
.review-opt.correct{border-color:var(--success);background:rgba(0,184,148,.12);color:var(--success);font-weight:700}
.review-opt.wrong{border-color:var(--danger);background:rgba(225,112,85,.12);color:var(--danger)}
/* ═══ TIMER ═══ */
.timer-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;font-size:.85rem;color:var(--text2);font-weight:500}
.timer-bar .time{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.skip-link{position:absolute;top:-100px;left:16px;background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;font-size:.9rem;text-decoration:none;transition:top .2s}
.skip-link:focus{top:16px}
/* ═══ TOP HEADER ═══ */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.app-header h2{font-size:1.1rem;font-weight:800;display:flex;align-items:center;gap:6px}
.app-test-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
/* ═══ BOTTOM NAV ═══ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.bottom-nav-tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;border:none;background:none;color:var(--text2);font:inherit;font-size:.7rem;font-weight:500;cursor:pointer;border-radius:10px;transition:all .2s;min-width:64px}
.bottom-nav-tab .nav-icon{font-size:1.3rem;line-height:1}
.bottom-nav-tab.active{color:var(--accent);background:var(--accent-glow)}
.bottom-nav-tab:hover{color:var(--accent)}
@media(min-width:768px){.bottom-nav-tab{min-width:80px;font-size:.75rem;padding:8px 20px}}
</style>
</head>
<body>
<a href="#content" class="skip-link">رد شدن به محتوا</a>
<div class="app" id="app">
<div class="app-header" id="appHeader">
  <h2>🎯 تعیین سطح انگلیسی</h2>
  <button class="theme-toggle" id="themeBtn" type="button" aria-label="تغییر پوسته" style="width:32px;height:32px;font-size:.85rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text)">🌙</button>
</div>
<div class="app-test-topbar" id="testTopbar" style="display:none">
  <div style="display:flex;align-items:center;gap:8px">
    <button class="back-btn" id="backBtn" type="button" aria-label="بازگشت">→</button>
    <h2 id="pageTitle" style="font-size:1.05rem;font-weight:700">🎯 تعیین سطح</h2>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="theme-toggle" id="themeBtn2" type="button" aria-label="تغییر پوسته" style="width:32px;height:32px;font-size:.85rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text)">🌙</button>
  </div>
</div>
<main class="main">
<div id="content"></div>
</main>
</div>
<div class="bottom-nav" id="bottomNav">
  <button class="bottom-nav-tab active" data-tab="home"><span class="nav-icon">🏠</span><span>خانه</span></button>
  <button class="bottom-nav-tab" data-tab="results"><span class="nav-icon">📊</span><span>نتایج</span></button>
  <button class="bottom-nav-tab" data-tab="about"><span class="nav-icon">ℹ️</span><span>درباره</span></button>
</div>
<div class="toast-container" id="toasts" aria-live="polite"></div>
<script>
// ═══════════════════════════════════════════
// CONSTANTS & STATE
// ═══════════════════════════════════════════
const LS_KEY='englishquiz_v1';
let currentTab='home';
let S=loadState();

function defaultState(){return{theme:'dark',results:[],currentTest:null,testHistory:[]}}
function loadState(){try{const d=localStorage.getItem(LS_KEY);if(!d)return defaultState();return{...defaultState(),...JSON.parse(d)}}catch(e){return defaultState()}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function toast(msg,type='info'){const c=document.getElementById('toasts');const t=document.createElement('div');t.className='toast toast-'+type;t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),3500)}

// ═══════════════════════════════════════════
// CEFR VOCABULARY DATABASE
// ═══════════════════════════════════════════
const CEFR_WORDS={

// TEST ENGINE
// ═══════════════════════════════════════════
let testState={section:null,questions:[],currentQ:0,answers:[],score:0,startTime:0,timer:null,timeLeft:0,answered:false};
let results={vocab:0,grammar:0,listening:0,writing:0,level:'',totalScore:0};

function generateTestQuestions(section){
  const questions=[];
  if(section==='vocab'){
    // 8 questions per level, mixed
    const levels=Object.keys(CEFR_WORDS);
    levels.forEach(level=>{
      const words=shuffle(CEFR_WORDS[level]).slice(0,4);
      words.forEach(w=>{
        // Get wrong answers from other levels
        const otherLevels=levels.filter(l=>l!==level);
        const wrongWords=[];
        otherLevels.forEach(ol=>{
          const rnd=shuffle(CEFR_WORDS[ol]).slice(0,2);
          wrongWords.push(...rnd);
        });
        const wrongOptions=shuffle(wrongWords).slice(0,3).map(x=>x.d);
        if(wrongOptions.length<3)return;
        const options=shuffle([w.d,...wrongOptions]);
        questions.push({level,word:w.w,pos:w.pos,question:'معنی کلمه "'+w.w+'" چیست؟',options,answer:options.indexOf(w.d),explain:w.w+' یعنی '+w.d+' ('+w.pos+')'});
      });
    });
    return shuffle(questions).slice(0,30);
  }
  if(section==='grammar'){
    const all=[];
    Object.keys(GRAMMAR_QUESTIONS).forEach(level=>{
      GRAMMAR_QUESTIONS[level].forEach(q=>all.push({...q,level}));
    });
    return shuffle(all).slice(0,25);
  }
  if(section==='listening'){
    const all=[];
    Object.keys(LISTENING_SENTENCES).forEach(level=>{
      LISTENING_SENTENCES[level].forEach(s=>all.push({sentence:s,level}));
    });
    return shuffle(all).slice(0,15);
  }
  if(section==='writing'){
    const all=[];
    Object.keys(WRITING_PROMPTS).forEach(level=>{
      WRITING_PROMPTS[level].forEach(p=>all.push({prompt:p,level}));
    });
    return shuffle(all).slice(0,5);
  }
  return questions;
}

function fmtTime(sec){
  const m=Math.floor(sec/60);
  const r=sec%60;
  return m+':'+(r<10?'0':'')+r;
}
function elapsedSec(){return Math.floor((Date.now()-testState.startTime)/1000)}
function startTimer(){
  const s=testState;
  if(s.timer)clearInterval(s.timer);
  s.timer=setInterval(()=>{
    const el=document.getElementById('qTimer');
    if(el)el.textContent='⏱ '+fmtTime(elapsedSec());
  },1000);
  const el0=document.getElementById('qTimer');
  if(el0)el0.textContent='⏱ 0:00';
}
function stopTimer(){
  const s=testState;
  if(s.timer){clearInterval(s.timer);s.timer=null;}
}
function startTest(section){
  testState={section,questions:generateTestQuestions(section),currentQ:0,answers:{},score:0,startTime:Date.now(),timer:null,timeLeft:0,answered:false,reviewMode:false};
  startTimer();

}
function calcVocabLevel(score,total){
  const pct=score/total*100;
  if(pct>=95)return'C2';if(pct>=85)return'C1';if(pct>=70)return'B2';if(pct>=55)return'B1';if(pct>=35)return'A2';return'A1';
}
function calcGrammarLevel(score,total){
  const pct=score/total*100;
  if(pct>=90)return'C2';if(pct>=80)return'C1';if(pct>=65)return'B2';if(pct>=50)return'B1';if(pct>=30)return'A2';return'A1';
}
function getOverallLevel(levels){
  const map={A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};
  const names=['A1','A2','B1','B2','C1','C2'];
  const vals=levels.filter(v=>v>0);
  if(!vals.length)return'A1';
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const idx=Math.min(5,Math.max(0,Math.round(avg)-1));
  return names[idx];
}

// SPEECH (TTS)
// ═══════════════════════════════════════════
function speak(text,rate=0.85){
  if(!window.speechSynthesis){toast('تبدیل متن به صدا در این مرورگر پشتیبانی نمی‌شود','error');return null}
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=rate;u.pitch=1;
    const voices=window.speechSynthesis.getVoices();
    const en=voices.find(v=>v.lang.startsWith('en-US'))||voices.find(v=>v.lang.startsWith('en'));
    if(en)u.voice=en;
    u.onerror=function(e){console.warn('Speech error:',e.error);toast('خطا در پخش صدا — لطفاً HTTPS استفاده کنید','error')};
    window.speechSynthesis.speak(u);
    return u;
  }catch(err){
    console.warn('Speech API error:',err);
    toast('تبدیل متن به صدا نیاز به HTTPS دارد','error');
    return null;
  }
}

// ═══════════════════════════════════════════
// WRITING EVALUATOR
// ═══════════════════════════════════════════
function evaluateWriting(text,promptLevel){
  if(!text||text.trim().length<5)return{score:0,feedback:'لطفاً جمله‌ای بنویسید.',level:'A1',class:'weak',details:{vocab:0,grammar:0,structure:0}};
  const words=text.trim().split(/\s+/);
  const wordCount=words.length;
  let vocabScore=0,grammarScore=0,structureScore=0;const tips=[];
  
  // ═══ VOCABULARY SCORE (0-35) ═══
  // Word count
  const minWords={A1:3,A2:6,B1:10,B2:14,C1:18,C2:22};
  if(wordCount>=minWords[promptLevel])vocabScore+=10;else if(wordCount>=4)vocabScore+=5;else tips.push('تعداد کلمات کم است — سعی کنید بیشتر بنویسید.');
  // Advanced vocabulary
  const advWords=['however','therefore','furthermore','moreover','consequently','nevertheless','despite','although','whereas','notwithstanding','ubiquitous','paradigm','juxtaposition','ephemeral','articulate','pragmatic','resilient','exacerbate','alleviate','dichotomy','paradox','nuance','comprehensive','prevalent','undermine','bolster','contemplate','scrutinize','facilitate','deteriorate'];
  const advCount=words.filter(w=>advWords.includes(w.toLowerCase())).length;
  if(advCount>=3)vocabScore+=15;else if(advCount>=1)vocabScore+=10;else tips.push('از واژگان پیشرفته‌تر مثل however, therefore, despite استفاده کنید.');
  // Unique words ratio
  const uniqueWords=new Set(words.map(w=>w.toLowerCase()));
  const uniqueRatio=uniqueWords.size/wordCount;
  if(uniqueRatio>=0.8)vocabScore+=10;else if(uniqueRatio>=0.6)vocabScore+=5;
  
  // ═══ GRAMMAR SCORE (0-35) ═══
  // Capitalization
  if(/^[A-Z]/.test(text.trim()))grammarScore+=5;else tips.push('جمله با حرف بزرگ شروع شود.');
  // Punctuation
  if(/[.!?]$/.test(text.trim()))grammarScore+=5;else tips.push('جمله با نقطه یا علامت سوال تمام شود.');
  // Subject-verb agreement (basic)
  const svPatterns=[/\b(he|she|it)\s+(is|has|does|goes|works|plays|lives|watches|studies)\b/i,/\b(they|we|you|I)\s+(are|have|do|go|work|play|live|watch|study)\b/i];
  if(svPatterns.some(p=>p.test(text)))grammarScore+=10;
  // Articles (a/an/the)
  if(/\b(a|an|the)\b/i.test(text))grammarScore+=5;
  // Prepositions
  if(/\b(in|on|at|for|with|from|to|by|about|between|among)\b/i.test(text))grammarScore+=5;
  // Tense markers
  if(/\b(has|have|had|was|were|will|would|could|should|might|can)\b/i.test(text))grammarScore+=5;
  // Spelling check
  const commonMisspellings=['teh','adn','recieve','seperate','occured','definately','accomodate','embarass','necessery','succesful','becuase','wich','thier','priviledge','independant'];
  const misspelled=words.filter(w=>commonMisspellings.includes(w.toLowerCase()));
  if(misspelled.length>0){grammarScore-=5;tips.push('املای اشتباه: '+misspelled.join(', '))}else grammarScore+=5;
  
  // ═══ STRUCTURE SCORE (0-30) ═══
  // Sentence count
  const sentences=text.split(/[.!?]+/).filter(s=>s.trim().length>0);
  if(sentences.length>=3)structureScore+=10;else if(sentences.length>=2)structureScore+=7;else{structureScore+=3;tips.push('بیش از یک جمله بنویسید.')}
  // Complex connectors
  const connectors=['because','although','while','however','therefore','furthermore','moreover','consequently','nevertheless','despite','whereas','if','when','since','after','before','that','which','who','whom','whose'];
  const usedConnectors=words.filter(w=>connectors.includes(w.toLowerCase()));
  if(usedConnectors.length>=3)structureScore+=12;else if(usedConnectors.length>=1)structureScore+=8;else tips.push('از ربط‌دهنده‌ها مثل because, although, however استفاده کنید.');
  // Question or exclamation
  if(/[?!]/.test(text))structureScore+=3;
  // Passive voice check
  if(/\b(was|were|is|are|been|be|being)\s+\w+ed\b/i.test(text))structureScore+=5;
  
  // Calculate total
  const totalScore=Math.max(0,Math.min(100,vocabScore+grammarScore+structureScore));
  
  // Determine level
  let level='A1',cls='weak';
  if(totalScore>=85){level='C2';cls='good'}
  else if(totalScore>=70){level='C1';cls='good'}
  else if(totalScore>=55){level='B2';cls='good'}
  else if(totalScore>=40){level='B1';cls='moderate'}
  else if(totalScore>=25){level='A2';cls='moderate'}
  else{level='A1';cls='weak'}
  
  return{score:totalScore,feedback:tips.length?tips.join('\n'):'عالی! نوشته شما بسیار خوب است.',level,class:cls,details:{vocab:Math.round(vocabScore/35*100),grammar:Math.round(grammarScore/35*100),structure:Math.round(structureScore/30*100)}};
}

// QUIZ QUESTION RENDERER
// ═══════════════════════════════════════════
function renderQuizQuestion(c){
  const s=testState;
  if(!s.questions.length){c.innerHTML='<div class="card" style="text-align:center;padding:40px"><div class="empty"><div class="icon">📝</div><p>سوالی موجود نیست</p></div></div>';return}

  if(s.currentQ>=s.questions.length){
    // Section complete
    finishSection();
    return;
  }

  const q=s.questions[s.currentQ];
  const progress=Math.round((s.currentQ/s.questions.length)*100);
  const sectionNames={vocab:'واژگان',grammar:'گرامر',listening:'لیسنینگ',writing:'رایتینگ'};

  if(s.section==='listening'){
    renderListeningQuestion(c,q,s);
    return;
  }
  if(s.section==='writing'){
    renderWritingQuestion(c,q,s);
    return;
  }

  // Multiple choice (vocab & grammar)
  const qText=q.question||q.q||'';
  const prevAns=s.answers[s.currentQ];
  const hasAnswer=prevAns&&prevAns.answer!==undefined&&prevAns.answer>=0;
  let html=`
  <div class="timer-bar">
    <span>${sectionNames[s.section]} — سوال ${s.currentQ+1} از ${s.questions.length}</span>
    <span style="display:flex;gap:10px"><span class="time" id="qTimer">⏱ 0:00</span><span class="time">${Math.round(progress)}%</span></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
  <div class="question-card card">
    <div class="q-number">سوال ${s.currentQ+1}</div>
    ${q.level?'<span class="badge badge-accent" style="margin-bottom:8px">'+q.level+'</span>':''}
    <div class="q-text" style="direction:ltr;text-align:left">${esc(qText)}</div>
    <div class="q-options" id="qOptions">
      ${q.options.map((opt,i)=>'<button class="q-option'+(hasAnswer&&prevAns.answer===i?' selected':'')+'" data-idx="'+i+'">'+esc(opt)+'</button>').join('')}
    </div>
    <div class="q-nav">
      <button class="btn btn-ghost btn-sm" onclick="goPrev()" ${s.currentQ===0?'disabled style="opacity:.4"':''}>→ قبلی</button>
      ${hasAnswer?'':'<button class="btn btn-ghost btn-sm" onclick="skipQuestion()">رد شدن →</button>'}
      ${s.currentQ>=s.questions.length-1?'<button class="btn btn-primary btn-sm" onclick="finishTest()">پایان آزمون ✓</button>':'<button class="btn btn-primary btn-sm" onclick="goNext()">بعدی ←</button>'}
    </div>
  </div>`;

  c.innerHTML=html;

  // Bind options — record silently, correct answer is revealed at the end
  document.querySelectorAll('.q-option').forEach(btn=>{
    btn.onclick=()=>{
      if(s.answered)return;
      s.answered=true;
      const idx=parseInt(btn.dataset.idx);
      s.answers[s.currentQ]={qIdx:s.currentQ,answer:idx,correct:idx===q.answer};
      recalcScore();
      // Only mark the user's selection — no correct/wrong shown now
      document.querySelectorAll('.q-option').forEach((b,i)=>{
        b.disabled=true;
        if(i===idx)b.classList.add('selected');
      });
      setTimeout(()=>{s.currentQ++;s.answered=false;renderQuizQuestion(c)},450);
    };
  });
}
function recalcScore(){
  const s=testState;
  let sc=0;
  Object.keys(s.answers).forEach(k=>{if(s.answers[k]&&s.answers[k].correct)sc++});
  s.score=sc;
}

function skipQuestion(){
  const s=testState;
  if(s.answered)return;
  if(s.answers[s.currentQ]&&s.answers[s.currentQ].answer>=0)return;
  s.answers[s.currentQ]={qIdx:s.currentQ,answer:-1,correct:false,skipped:true};
  recalcScore();
  s.currentQ++;
  s.answered=false;
  startTimer();
  renderQuizQuestion(document.getElementById('content'));
}

function goPrev(){
  const s=testState;
  if(s.currentQ>0){s.currentQ--;s.answered=false;renderQuizQuestion(document.getElementById('content'));}
}
function goNext(){
  const s=testState;
  if(s.currentQ<s.questions.length-1){s.currentQ++;s.answered=false;renderQuizQuestion(document.getElementById('content'));}
}
function goToFirstUnanswered(){
  const s=testState;
  for(let i=0;i<s.questions.length;i++){
    const a=s.answers[i];
    if(!a||a.answer<0){s.currentQ=i;s.answered=false;renderQuizQuestion(document.getElementById('content'));return;}
  }
  finishTest();
}

  c.innerHTML=

      '<div class="stat-grid" style="margin-top:14px">'+
        '<div class="stat-card"><div class="val" style="color:var(--success)">'+s.score+'</div><div class="lbl">صحیح</div></div>'+
        '<div class="stat-card"><div class="val">'+s.questions.length+'</div><div class="lbl">کل سوالات</div></div>'+
        '<div class="stat-card"><div class="val" style="color:var(--danger)">'+(s.questions.length-s.score)+'</div><div class="lbl">نادرست/ردشده</div></div>'+'<div class="stat-card"><div class="val" style="font-size:1.4rem">'+fmtTime(elapsedSec())+'</div><div class="lbl">⏱ زمان</div></div>'+

// LISTENING QUESTION
// ═══════════════════════════════════════════
function renderListeningQuestion(c,q,s){
  const progress=Math.round((s.currentQ/s.questions.length)*100);
  const prevAns=s.answers[s.currentQ];
  const hasAnswer=prevAns&&prevAns.answer!==undefined&&prevAns.answer!==-1&&prevAns.answer!=='';
  let html=`
  <div class="timer-bar">
    <span>لیسنینگ — جمله ${s.currentQ+1} از ${s.questions.length}</span>
    <span style="display:flex;gap:10px"><span class="time" id="qTimer">⏱ 0:00</span><span class="time">${Math.round(progress)}%</span></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
  <div class="question-card card" style="text-align:center">
    <div class="q-number">جمله ${s.currentQ+1} — <span class="badge badge-warning">${q.level}</span></div>
    <div style="margin:20px 0">
      <button class="listen-btn" id="listenBtn" type="button">🔊</button>
      <p style="font-size:.8rem;color:var(--text2);margin-top:8px">روی دکمه کلیک کنید تا جمله پخش شود</p>
      <p id="speechWarning" style="font-size:.7rem;color:var(--warning);margin-top:4px;display:none">⚠️ تبدیل متن به صدا نیاز به HTTPS دارد</p>
    </div>
    <div style="margin-bottom:16px">
      <input type="text" class="q-input" id="listenInput" placeholder="جمله را اینجا تایپ کنید..." autocomplete="off" autocapitalize="off" spellcheck="false" value="${hasAnswer&&prevAns.answer!==-1?esc(String(prevAns.answer).replace(/"/g,'&quot;')):''}">
    </div>
    <div class="q-nav">
      <button class="btn btn-ghost btn-sm" onclick="goPrev()" ${s.currentQ===0?'disabled style="opacity:.4"':''}>→ قبلی</button>
      ${hasAnswer?'':'<button class="btn btn-ghost btn-sm" onclick="skipQuestion()">رد شدن →</button>'}
      <button class="btn btn-success btn-sm" id="listenCheck">بررسی ✓</button>
      ${s.currentQ>=s.questions.length-1?'<button class="btn btn-primary btn-sm" onclick="finishTest()">پایان آزمون ✓</button>':'<button class="btn btn-primary btn-sm" onclick="goNext()">بعدی ←</button>'}
    </div>
  </div>`;

  c.innerHTML=html;

  const playAudio=()=>speak(q.sentence,0.85);
  document.getElementById('listenBtn').onclick=playAudio;
  setTimeout(playAudio,300);

  const input=document.getElementById('listenInput');
  input.focus();

  // Record silently — the correct sentence is revealed in the final review
  document.getElementById('listenCheck').onclick=()=>{
    const userAnswer=input.value.trim().toLowerCase();
    const correctAnswer=q.sentence.toLowerCase().replace(/[.,!?]/g,'');
    const similarity=calcSimilarity(userAnswer,correctAnswer);
    const isCorrect=similarity>=0.7;
    s.answers[s.currentQ]={qIdx:s.currentQ,answer:input.value.trim(),correct:isCorrect,similarity};
    recalcScore();
    s.answered=true;
    input.disabled=true;
    document.getElementById('listenCheck').disabled=true;
    setTimeout(()=>{s.currentQ++;s.answered=false;renderQuizQuestion(c)},450);
  };

  input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('listenCheck').click()}};
}
function calcSimilarity(a,b){
  if(!a||!b)return 0;
  const aWords=a.split(/\s+/);
  const bWords=b.split(/\s+/);
  let matches=0;
  aWords.forEach(w=>{if(bWords.includes(w))matches++});
  return matches/Math.max(aWords.length,bWords.length);
}

// ═══════════════════════════════════════════
// WRITING QUESTION
// ═══════════════════════════════════════════
function renderWritingQuestion(c,q,s){
  const progress=Math.round((s.currentQ/s.questions.length)*100);
  const prevAns=s.answers[s.currentQ];
  const hasAnswer=prevAns&&prevAns.answer!==undefined&&prevAns.answer!==-1&&prevAns.answer!=='';
  let html=`
  <div class="timer-bar">
    <span>رایتینگ — موضوع ${s.currentQ+1} از ${s.questions.length}</span>
    <span style="display:flex;gap:10px"><span class="time" id="qTimer">⏱ 0:00</span><span class="time">${Math.round(progress)}%</span></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
  <div class="question-card card">
    <div class="q-number">موضوع ${s.currentQ+1} — <span class="badge badge-danger">${q.level}</span></div>
    <div class="q-text" style="direction:ltr;text-align:left">${esc(q.prompt)}</div>
    <textarea class="writing-area" id="writingInput" placeholder="Type your answer in English..." rows="4">${hasAnswer&&prevAns.answer!==-1?esc(String(prevAns.answer)):''}</textarea>
    <div class="q-nav">
      <button class="btn btn-ghost btn-sm" onclick="goPrev()" ${s.currentQ===0?'disabled style="opacity:.4"':''}>→ قبلی</button>
      ${hasAnswer?'':'<button class="btn btn-ghost btn-sm" onclick="skipQuestion()">رد شدن →</button>'}
      <button class="btn btn-success btn-sm" id="writingCheck">بررسی ✓</button>
      ${s.currentQ>=s.questions.length-1?'<button class="btn btn-primary btn-sm" onclick="finishTest()">پایان آزمون ✓</button>':'<button class="btn btn-primary btn-sm" onclick="goNext()">بعدی ←</button>'}
    </div>
  </div>`;

  c.innerHTML=html;

  // Record silently — the score and feedback are shown in the final review
  document.getElementById('writingCheck').onclick=()=>{
    const text=document.getElementById('writingInput').value;
    if(!text.trim()){toast('لطفاً چیزی بنویسید','error');return}
    const result=evaluateWriting(text,q.level);
    s.answers[s.currentQ]={qIdx:s.currentQ,answer:text,correct:result.score>=50,score:result.score};
    recalcScore();
    s.answered=true;
    document.getElementById('writingInput').disabled=true;
    document.getElementById('writingCheck').disabled=true;
    setTimeout(()=>{s.currentQ++;s.answered=false;renderQuizQuestion(c)},450);
  };
}

// SECTION COMPLETE
// ═══════════════════════════════════════════
function finishSection(){
  stopTimer();
  const s=testState;
  const total=s.questions.length;
  const pct=Math.round(s.score/total*100);
  const sectionNames={vocab:'واژگان',grammar:'گرامر',listening:'لیسنینگ',writing:'رایتینگ'};

  let level='';
  if(s.section==='vocab')level=calcVocabLevel(s.score,total);
  else if(s.section==='grammar')level=calcGrammarLevel(s.score,total);
  else if(s.section==='listening')level=calcVocabLevel(s.score,total);
  else{
    // Writing average
    const writingScores=Object.values(s.answers).filter(a=>a.score!==undefined).map(a=>a.score);
    const avg=writingScores.length?writingScores.reduce((a,b)=>a+b,0)/writingScores.length:0;
    if(avg>=80)level='C1';else if(avg>=60)level='B2';else if(avg>=40)level='B1';else level='A2';
  }

  results[s.section]=pct;

  // Save result
  S.results.push({date:new Date().toISOString(),section:s.section,level,score:s.score,total,pct});
  save();

  const c=document.getElementById('content');
  c.innerHTML=`
  <div class="card" style="text-align:center;max-width:500px;margin:40px auto">
    <div style="font-size:3rem;margin-bottom:16px">🎉</div>
    <h2 style="margin-bottom:8px">${sectionNames[s.section]} تمام شد!</h2>
    <div style="font-size:3rem;font-weight:900;color:var(--accent);margin:16px 0">${level}</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="val">${s.score}/${total}</div><div class="lbl">پاسخ صحیح</div></div>
      <div class="stat-card"><div class="val">${pct}%</div><div class="lbl">درصد</div></div>
      <div class="stat-card"><div class="val" style="font-size:1.5rem">${fmtTime(elapsedSec())}</div><div class="lbl">⏱ زمان</div></div>
    </div>
    <div class="q-nav" style="margin-top:20px">
      <button class="btn btn-primary" onclick="currentTab='home';navHistory=['home'];render()">بازگشت به خانه</button>
      <button class="btn btn-ghost" onclick="navigateTo('results')">مشاهده نتایج</button>
    </div>
  </div>`;

  // Save score for full test tracking
  fullTestState.scores[s.section]=pct;
  
  // Show next-step options
  c.innerHTML+=`
  <div class="card" style="max-width:500px;margin:16px auto;text-align:center">
    <h3 style="margin-bottom:12px">🎯 بخش بعدی؟</h3>
    <p style="color:var(--text2);font-size:.85rem;margin-bottom:16px">کدوم بخش رو می‌خواید ادامه بدید؟</p>
    <div style="display:grid;gap:8px">
      <button class="quiz-section-btn" onclick="navigateTo('vocab')" style="padding:12px">
        <span style="font-size:1.2rem">📖</span>
        <span style="flex:1;text-align:right">واژگان</span>
      </button>
      <button class="quiz-section-btn" onclick="navigateTo('grammar')" style="padding:12px">
        <span style="font-size:1.2rem">✏️</span>
        <span style="flex:1;text-align:right">گرامر</span>
      </button>
      <button class="quiz-section-btn" onclick="navigateTo('listening')" style="padding:12px">
        <span style="font-size:1.2rem">🎧</span>
        <span style="flex:1;text-align:right">لیسنینگ</span>
      </button>
      <button class="quiz-section-btn" onclick="navigateTo('writing')" style="padding:12px">
        <span style="font-size:1.2rem">📝</span>
        <span style="flex:1;text-align:right">رایتینگ</span>

}

function renderResults(c){
  const history=S.results.slice(-50);
  if(!history.length){c.innerHTML='<div class="card" style="text-align:center;padding:60px"><div class="empty"><div class="icon">📊</div><p>هنوز آزمونی نداده‌اید</p><button class="btn btn-primary" style="margin-top:16px" onclick="currentTab=\'home\';render()">شروع آزمون</button></div></div>';return}

  // Get latest scores by section
  const latest={};
  const historyReversed=[...history].reverse();
  historyReversed.forEach(r=>{if(!latest[r.section])latest[r.section]=r});

  const sectionNames={vocab:'واژگان',grammar:'گرامر',listening:'لیسنینگ',writing:'رایتینگ'};
  const sectionIcons={vocab:'📖',grammar:'✏️',listening:'🎧',writing:'📝'};
  const sectionColors={vocab:'#6c5ce7',grammar:'#00b894',listening:'#fdcb6e',writing:'#e17055'};

  // Calculate overall level
  const scores=Object.values(latest).map(r=>r.pct);
  const avgScore=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
  let overallLevel='A1';
  if(avgScore>=90)overallLevel='C2';else if(avgScore>=80)overallLevel='C1';else if(avgScore>=65)overallLevel='B2';else if(avgScore>=50)overallLevel='B1';else if(avgScore>=35)overallLevel='A2';

  const levelDescs={A1:'مبتدی — Basic',A2:'ابتدایی — Elementary',B1:'متوسط — Intermediate',B2:'فوق متوسط — Upper-Intermediate',C1:'پیشرفته — Advanced',C2:'ماهر — Proficient'};
  const levelTips={
    A1:'تمرین روزانه واژگان پایه و جملات ساده. فیلم‌های ساده با زیرنویس ببینید.',
    A2:'کتاب‌های ساده انگلیسی بخوانید. مکالمه روزمره تمرین کنید.',
    B1:'پادکست انگلیسی گوش دهید. مقالات ساده بنویسید.',
    B2:'کتاب‌های داستانی بخوانید. در بحث‌های انگلیسی شرکت کنید.',
    C1:'مقالات علمی بخوانید. مقاله بنویسید و از دیگران feedback بگیرید.',
    C2:'متون ادبی و علمی پیچیده بخوانید. ترجمه و تفسیر تمرین کنید.'
  };

  // Find weakest and strongest sections
  const sectionScores=Object.keys(latest).map(s=>({section:s,pct:latest[s].pct}));
  sectionScores.sort((a,b)=>a.pct-b.pct);
  const weakest=sectionScores[0];
  const strongest=sectionScores[sectionScores.length-1];

  // Build chart data (simple CSS bar chart)
  let html=`
  <div class="result-hero">
    <div style="font-size:3rem;margin-bottom:8px">🎯</div>
    <div class="level-badge">${overallLevel}</div>
    <div class="level-label">${levelDescs[overallLevel]}</div>
    <div class="level-desc">میانگین امتیاز: ${avgScore}%</div>
  </div>

  <div class="level-scale">
    ${['A1','A2','B1','B2','C1','C2'].map(l=>'<div class="ls-item'+(l===overallLevel?' current':'')+'">'+l+'</div>').join('')}
  </div>

  <!-- ═══ Radar-style Chart ═══ -->
  <div class="card" style="margin-bottom:16px">
    <h3 style="margin-bottom:16px">📊 نمودار مهارت‌ها</h3>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px">
      ${Object.keys(sectionNames).map(sec=>{
        const r=latest[sec];
        const pct=r?r.pct:0;
        const color=sectionColors[sec];
        return`<div style="text-align:center">
          <div style="position:relative;width:100px;height:100px;margin:0 auto 8px">
            <svg viewBox="0 0 100 100" style="transform:rotate(-90deg)">
              <circle cx="50" cy="50" r="40" fill="none" stroke="var(--border)" stroke-width="8"/>
              <circle cx="50" cy="50" r="40" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${pct*2.51} 251" stroke-linecap="round"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;color:${color}">${pct}%</div>
          </div>
          <div style="font-size:.85rem;font-weight:600">${sectionIcons[sec]} ${sectionNames[sec]}</div>
          <div style="font-size:.75rem;color:var(--text2)">${r?r.level:'—'}</div>
        </div>`;
      }).join('')}
    </div>
  </div>

  <!-- ═══ Score Bars ═══ -->
  <div class="card" style="margin-bottom:16px">
    <h3 style="margin-bottom:16px">📈 مقایسه امتیازها</h3>
    ${Object.keys(sectionNames).map(sec=>{
      const r=latest[sec];
      if(!r)return'';
      return`<div class="score-bar">
        <div class="label">${sectionIcons[sec]} ${sectionNames[sec]}</div>
        <div class="bar"><div class="fill" style="width:${r.pct}%;background:${sectionColors[sec]}"></div></div>
        <div class="pct" style="color:${sectionColors[sec]}">${r.pct}%</div>
      </div>`;
    }).join('')}
  </div>

  <!-- ═══ Improvement Suggestions ═══ -->
  <div class="card" style="margin-bottom:16px;border:2px solid var(--accent)">
    <h3 style="margin-bottom:12px;color:var(--accent)">💡 پیشنهادات بهبود</h3>
    <div style="padding:12px;background:var(--bg);border-radius:10px;margin-bottom:12px;border-right:3px solid var(--success)">
      <strong style="font-size:.9rem">✅ نقطه قوت: ${sectionNames[strongest.section]}</strong>

    </div>

      <strong style="font-size:.9rem">⚠️ نقطه ضعف: ${sectionNames[weakest.section]}</strong>
      <p style="color:var(--text2);font-size:.8rem;margin-top:4px">امتیاز ${weakest.pct}% — این بخش نیاز به تمرین بیشتری دارد.</p>
    </div>
    <div style="padding:12px;background:var(--bg);border-radius:10px;border-right:3px solid var(--accent)">
      <strong style="font-size:.9rem">🎯 توصیه برای سطح ${overallLevel}:</strong>
      <p style="color:var(--text2);font-size:.8rem;margin-top:4px">${levelTips[overallLevel]}</p>
    </div>
  </div>

  <!-- ═══ History ═══ -->

    <div style="max-height:400px;overflow-y:auto">
      ${historyReversed.map(r=>`
        <div style="display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--border)">

        </div>
      `).join('')}
    </div>
  </div>`;

  c.innerHTML=html;
}
